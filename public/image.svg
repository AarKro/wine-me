<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="4000" height="3000" viewBox="0 0 4000 3000">
  <defs>
    <pattern id="grid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#1a1f2e"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#2a3142" stroke-width="2"/>
    </pattern>
    <pattern id="bigGrid" width="1000" height="1000" patternUnits="userSpaceOnUse">
      <rect width="1000" height="1000" fill="url(#grid)"/>
      <path d="M 1000 0 L 0 0 0 1000" fill="none" stroke="#4a5470" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="4000" height="3000" fill="url(#bigGrid)"/>

  <g font-family="system-ui, sans-serif" fill="#7a8aa0" text-anchor="middle">
    <text x="500" y="500" font-size="80">A1</text>
    <text x="1500" y="500" font-size="80">B1</text>
    <text x="2500" y="500" font-size="80">C1</text>
    <text x="3500" y="500" font-size="80">D1</text>
    <text x="500" y="1500" font-size="80">A2</text>
    <text x="1500" y="1500" font-size="80">B2</text>
    <text x="2500" y="1500" font-size="80">C2</text>
    <text x="3500" y="1500" font-size="80">D2</text>
    <text x="500" y="2500" font-size="80">A3</text>
    <text x="1500" y="2500" font-size="80">B3</text>
    <text x="2500" y="2500" font-size="80">C3</text>
    <text x="3500" y="2500" font-size="80">D3</text>
  </g>

  <g fill="#e8b04a" font-family="system-ui, sans-serif" text-anchor="middle">
    <circle cx="2000" cy="1500" r="60" />
    <text x="2000" y="1660" font-size="50" font-weight="600">CENTER</text>
    <text x="2000" y="1720" font-size="30" fill="#7a8aa0">4000 × 3000 placeholder</text>
    <text x="2000" y="1770" font-size="24" fill="#7a8aa0">replace /public/image.svg or /public/image.jpg</text>
  </g>

  <g fill="#50c878" font-family="system-ui, sans-serif" text-anchor="middle">
    <circle cx="100" cy="100" r="40"/>
    <text x="100" y="200" font-size="30">TL</text>
    <circle cx="3900" cy="100" r="40"/>
    <text x="3900" y="200" font-size="30">TR</text>
    <circle cx="100" cy="2900" r="40"/>
    <text x="100" y="2860" font-size="30">BL</text>
    <circle cx="3900" cy="2900" r="40"/>
    <text x="3900" y="2860" font-size="30">BR</text>
  </g>
</svg>
