<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Pan</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <img id="image" src="/image.png" alt="" draggable="false" />
      <svg
        id="markers"
        viewBox="0 0 2560 1600"
        width="2560"
        height="1600"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      ></svg>
    </div>
    <div id="slides" hidden></div>
    <div id="detail" hidden></div>
    <div id="cursor" hidden>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle class="ring-bg" cx="50" cy="50" r="44" pathLength="100" />
        <circle class="ring-progress" cx="50" cy="50" r="44" pathLength="100" />
      </svg>
    </div>
    <div id="preview">
      <video id="video" autoplay playsinline muted></video>
      <div id="status">LOADING</div>
    </div>
    <div id="error" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
