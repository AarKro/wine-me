<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="europe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2541"/>
      <stop offset="1" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="europe-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5bc0be"/>
      <stop offset="1" stop-color="#6fffe9"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#europe-bg)"/>
  <rect x="160" y="180" width="120" height="14" fill="url(#europe-accent)"/>
  <text x="160" y="320" font-family="system-ui, sans-serif" font-size="42" font-weight="500" fill="#5bc0be" letter-spacing="6">REGION 01</text>
  <text x="160" y="460" font-family="system-ui, sans-serif" font-size="180" font-weight="800" fill="#ffffff">Europe</text>
  <text x="160" y="560" font-family="system-ui, sans-serif" font-size="40" font-weight="400" fill="#a8b2c8">A continent of vineyards and rivers.</text>

  <g font-family="system-ui, sans-serif" fill="#ffffff">
    <g transform="translate(160, 700)">
      <text font-size="28" fill="#5bc0be" letter-spacing="4">VINEYARDS</text>
      <text y="60" font-size="64" font-weight="700">~3.2M ha</text>
    </g>
    <g transform="translate(680, 700)">
      <text font-size="28" fill="#5bc0be" letter-spacing="4">SIGNATURE</text>
      <text y="60" font-size="64" font-weight="700">Bordeaux</text>
    </g>
    <g transform="translate(1200, 700)">
      <text font-size="28" fill="#5bc0be" letter-spacing="4">HARVEST</text>
      <text y="60" font-size="64" font-weight="700">Sep – Oct</text>
    </g>
  </g>

  <text x="160" y="980" font-family="system-ui, sans-serif" font-size="28" fill="#5b6680">Two-finger swipe to return to the map.</text>
</svg>
