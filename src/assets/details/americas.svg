<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="americas-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1a1a"/>
      <stop offset="1" stop-color="#1a0a0a"/>
    </linearGradient>
    <linearGradient id="americas-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e07a5f"/>
      <stop offset="1" stop-color="#f2cc8f"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#americas-bg)"/>
  <rect x="160" y="180" width="120" height="14" fill="url(#americas-accent)"/>
  <text x="160" y="320" font-family="system-ui, sans-serif" font-size="42" font-weight="500" fill="#e07a5f" letter-spacing="6">REGION 02</text>
  <text x="160" y="460" font-family="system-ui, sans-serif" font-size="180" font-weight="800" fill="#ffffff">Americas</text>
  <text x="160" y="560" font-family="system-ui, sans-serif" font-size="40" font-weight="400" fill="#d8b6a8">Sun-drenched valleys from Napa to Mendoza.</text>

  <g font-family="system-ui, sans-serif" fill="#ffffff">
    <g transform="translate(160, 700)">
      <text font-size="28" fill="#e07a5f" letter-spacing="4">VINEYARDS</text>
      <text y="60" font-size="64" font-weight="700">~1.4M ha</text>
    </g>
    <g transform="translate(680, 700)">
      <text font-size="28" fill="#e07a5f" letter-spacing="4">SIGNATURE</text>
      <text y="60" font-size="64" font-weight="700">Malbec</text>
    </g>
    <g transform="translate(1200, 700)">
      <text font-size="28" fill="#e07a5f" letter-spacing="4">HARVEST</text>
      <text y="60" font-size="64" font-weight="700">Aug – Apr</text>
    </g>
  </g>

  <text x="160" y="980" font-family="system-ui, sans-serif" font-size="28" fill="#6b4a4a">Two-finger swipe to return to the map.</text>
</svg>
