<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d1b4e"/>
      <stop offset="1" stop-color="#1a0f2e"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg2)"/>
  <text x="960" y="180" font-family="system-ui, sans-serif" font-size="96" font-weight="800" fill="#ffffff" text-anchor="middle">Gestures</text>

  <g font-family="system-ui, sans-serif" fill="#ffffff" text-anchor="middle">
    <g transform="translate(320, 400)">
      <circle cx="160" cy="0" r="100" fill="#50c878" opacity="0.25"/>
      <text x="160" y="20" font-size="80">✊</text>
      <text x="160" y="180" font-size="42" font-weight="700">FIST</text>
      <text x="160" y="240" font-size="28" fill="#9aa5c1">Grab to pan</text>
    </g>
    <g transform="translate(800, 400)">
      <circle cx="160" cy="0" r="100" fill="#dc8c3c" opacity="0.25"/>
      <text x="160" y="20" font-size="80">✊✊</text>
      <text x="160" y="180" font-size="42" font-weight="700">TWO FISTS</text>
      <text x="160" y="240" font-size="28" fill="#9aa5c1">Pinch to zoom</text>
    </g>
    <g transform="translate(1280, 400)">
      <circle cx="160" cy="0" r="100" fill="#508ce6" opacity="0.25"/>
      <text x="160" y="20" font-size="80">✌</text>
      <text x="160" y="180" font-size="42" font-weight="700">TWO FINGERS</text>
      <text x="160" y="240" font-size="28" fill="#9aa5c1">Swipe to navigate</text>
    </g>
  </g>

  <text x="960" y="980" font-family="system-ui, sans-serif" font-size="32" font-weight="500" fill="#5b6680" text-anchor="middle">Slide 2 of 3</text>
</svg>
